<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>בנק המטרות I-PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Assistant', sans-serif; background: #f0f2f5; padding: 20px; direction: rtl; }
        .container { max-width: 900px; margin: 0 auto; }
        .search-box { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #ccc; font-size: 1.2em; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; border-right: 10px solid #3498db; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .label { font-weight: bold; color: #555; margin-top: 10px; display: block; }
        .methods { background: #f9f9f9; padding: 10px; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>בנק המטרות I-PRO</h1>
        <input type="text" id="search" class="search-box" placeholder="חפשי מספר מטרה או מילה...">
        <div id="results"></div>
    </div>

    <script src="goals_data.js"></script>
    <script src="goals_data_2.js"></script>
    <script>
        function showGoals(filter = '') {
            const div = document.getElementById('results');
            div.innerHTML = '';
            const term = filter.toLowerCase();
            
            const filtered = goalsData.filter(g => 
                g.id.toString() === term || 
                g.title.toLowerCase().includes(term) || 
                g.keywords.toLowerCase().includes(term)
            );

            filtered.forEach(g => {
                div.innerHTML += `
                    <div class="card">
                        <small>מטרה ${g.id} | ${g.cluster}</small>
                        <h2>${g.title}</h2>
                        <span class="label">🔍 הבעיה:</span> ${g.prob}
                        <span class="label">🎯 המטרה:</span> ${g.goal}
                        <div class="methods">
                            <span class="label">⚙️ דרכים אופרטיביות:</span>
                            <ul>${g.methods.map(m => `<li>${m}</li>`).join('')}</ul>
                        </div>
                    </div>`;
            });
        }
        document.getElementById('search').addEventListener('input', (e) => showGoals(e.target.value));
        window.onload = () => showGoals();
    </script>
</body>
</html>
