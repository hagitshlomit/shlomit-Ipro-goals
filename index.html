<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בנק המטרות I-PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Assistant', sans-serif; background-color: #f4f7f6; padding: 20px; color: #2d3748; }
        .container { max-width: 800px; margin: 0 auto; }
        .search-box { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; position: sticky; top: 10px; z-index: 100; }
        input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #ddd; font-size: 18px; outline: none; }
        .goal-card { background: white; border-radius: 15px; padding: 25px; margin-bottom: 20px; border-right: 15px solid #3498db; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .methods-list { margin-right: 20px; }
        .tag { font-size: 0.8em; color: #7f8c8d; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="חפשי קושי, מטרה או מספר (למשל: איחור, 195, חוסן)...">
        </div>
        <div id="results"></div>
    </div>

    <script src="goals_data.js"></script>
    <script>
        function render(filter = '') {
            const results = document.getElementById('results');
            results.innerHTML = '';
            const filtered = goalsData.filter(g => 
                g.title.includes(filter) || g.prob.includes(filter) || g.keywords.includes(filter) || g.id.toString() === filter
            ).sort((a,b) => a.id - b.id);

            filtered.forEach(g => {
                results.innerHTML += `
                    <div class="goal-card">
                        <div class="tag">מטרה ${g.id} | ${g.cluster}</div>
                        <h2>${g.title}</h2>
                        <p><strong>🔍 הבעיה הנצפית:</strong> ${g.prob}</p>
                        <p><strong>🎯 המטרה:</strong> ${g.goal}</p>
                        <p><strong>⚙️ 5 דרכי פעולה אופרטיביות:</strong></p>
                        <ul class="methods-list">${g.methods.map(m => `<li>${m}</li>`).join('')}</ul>
                    </div>
                `;
            });
        }
        document.getElementById('searchInput').addEventListener('input', e => render(e.target.value));
        window.onload = () => render();
    </script>
</body>
</html>
