<script>
    let allGoals = [];
    const files = ['1-50.json', '51-100.json', '101-150.json', '151-200.json', '201-250.json'];

    async function loadData() {
        for (let f of files) {
            try {
                const r = await fetch(f + '?v=' + Date.now());
                if (r.ok) {
                    const data = await r.json();
                    data.forEach(g => { if(!allGoals.find(x => x.id === g.id)) allGoals.push(g); });
                }
            } catch (e) { console.error("Error loading file " + f, e); }
        }
        populateFilters(); // יצירת רשימת מילות המפתח אוטומטית
        render();
    }

    // פונקציה שיוצרת את רשימת מילות המפתח בתיבת הסינון
    function populateFilters() {
        const tagFilter = document.getElementById('tagFilter');
        const allKeywords = new Set();
        
        allGoals.forEach(goal => {
            if (goal.keywords) {
                goal.keywords.forEach(kw => allKeywords.add(kw.trim()));
            }
        });

        // מיון אלפביתי של מילות המפתח
        const sortedKeywords = Array.from(allKeywords).sort();

        // הוספת מילות המפתח לאופציות בסינון
        sortedKeywords.forEach(kw => {
            const option = document.createElement('option');
            option.value = kw;
            option.innerText = kw;
            tagFilter.appendChild(option);
        });
    }

    function render() {
        const containers = { 'I AM': document.getElementById('I AM'), 'I MIX': document.getElementById('I MIX'), 'I TASK': document.getElementById('I TASK'), 'I NET': document.getElementById('I NET'), 'I GROW': document.getElementById('I GROW') };
        Object.values(containers).forEach(c => c.innerHTML = '');
        
        allGoals.sort((a,b) => a.id - b.id).forEach(goal => {
            const li = document.createElement('li');
            li.className = 'item';
            const keys = goal.keywords ? goal.keywords.join(' ') : '';
            li.setAttribute('data-keywords', keys);
            li.innerHTML = `<span class="item-title">#${goal.id} ${goal.title}</span><div class="item-prob">${goal.prob}</div>`;
            li.onclick = () => showDetail(goal);
            const target = containers[goal.cluster.toUpperCase()];
            if(target) target.appendChild(li);
        });
    }

    function showDetail(g) {
        const colors = {'I AM': 'var(--iam)', 'I MIX': 'var(--imix)', 'I TASK': 'var(--itask)', 'I NET': 'var(--inet)', 'I GROW': 'var(--igrow)'};
        document.getElementById('modalHeader').style.backgroundColor = colors[g.cluster.toUpperCase()] || '#333';
        document.getElementById('modalTitle').innerText = g.title;
        document.getElementById('modalProb').innerText = g.prob;
        document.getElementById('modalGoal').innerText = g.goal;
        
        const kwCard = document.getElementById('keywordsCard');
        if (g.keywords && g.keywords.length > 0) {
            kwCard.style.display = 'block';
            document.getElementById('modalKeywords').innerText = g.keywords.join(', ');
        } else { kwCard.style.display = 'none'; }

        document.getElementById('modalMethods').innerHTML = g.methods.map(m => `
            <li>
                <span>${m}</span>
                <button class="copy-btn" onclick="copyText('${m.replace(/'/g, "\\'")}')">העתק</button>
            </li>
        `).join('');
        
        document.getElementById('myModal').style.display = "block";
    }

    function copyText(text) {
        navigator.clipboard.writeText(text).then(() => {
            alert("הטקסט הועתק!");
        });
    }

    function closeModal() { document.getElementById('myModal').style.display = "none"; }

    function filter() {
        const searchVal = document.getElementById('search').value.toLowerCase();
        const tagVal = document.getElementById('tagFilter').value.toLowerCase();
        
        document.querySelectorAll('.item').forEach(el => {
            const content = el.innerText.toLowerCase();
            const keywords = el.getAttribute('data-keywords').toLowerCase();
            const matchSearch = content.includes(searchVal) || keywords.includes(searchVal);
            const matchTag = tagVal === "" || keywords.includes(tagVal);
            el.style.display = (matchSearch && matchTag) ? 'block' : 'none';
        });
    }

    window.onclick = (e) => { if (e.target == document.getElementById('myModal')) closeModal(); }
    loadData();
</script>
