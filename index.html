<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אינדקס יעדי התפתחות 1-250</title>
    <style>
        :root {
            --iam-color: #e67e22; --iwe-color: #27ae60; --itask-color: #2980b9;
            --bg: #f4f7f6; --text: #2c3e50;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: var(--itask-color); margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 25px; }
        .search-box { width: 100%; padding: 15px; margin-bottom: 30px; border: 2px solid #eee; border-radius: 30px; font-size: 18px; outline: none; transition: 0.3s; box-sizing: border-box; }
        .search-box:focus { border-color: var(--itask-color); }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; }
        .cluster-col { background: #fff; border-radius: 12px; border: 1px solid #eee; overflow: hidden; display: flex; flex-direction: column; }
        .cluster-h { padding: 15px; color: white; font-weight: bold; text-align: center; font-size: 1.2rem; }
        .iam-h { background: var(--iam-color); } .iwe-h { background: var(--iwe-color); } .itask-h { background: var(--itask-color); }
        
        .item-list { list-style: none; padding: 0; margin: 0; max-height: 600px; overflow-y: auto; }
        .item { padding: 12px 18px; border-bottom: 1px solid #f1f1f1; cursor: pointer; display: flex; align-items: center; transition: 0.2s; }
        .item:hover { background: #f0f7ff; }
        .item-id { background: #eee; padding: 2px 8px; border-radius: 4px; margin-left: 12px; font-size: 0.85em; font-weight: bold; color: #555; min-width: 35px; text-align: center; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(3px); }
        .modal-content { background: white; margin: 5% auto; padding: 35px; width: 90%; max-width: 700px; border-radius: 20px; position: relative; line-height: 1.7; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .close { position: absolute; left: 20px; top: 20px; font-size: 30px; cursor: pointer; color: #999; }
        .tag { display: inline-block; padding: 5px 15px; border-radius: 20px; color: white; margin-bottom: 15px; font-size: 0.9em; font-weight: bold; }
        
        .modal-body h3 { font-size: 1.1rem; color: #444; margin-bottom: 5px; margin-top: 15px; }
        .modal-body p { margin-top: 0; margin-bottom: 10px; background: #f9f9f9; padding: 10px; border-radius: 8px; }
        .methods-list { background: #f0f7ff; padding: 10px 25px; border-radius: 8px; font-size: 0.95rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>אינדקס יעדי התפתחות</h1>
    <p class="subtitle">ניהול ידע והתפתחות מקצועית (1-250)</p>
    <input type="text" id="search" class="search-box" placeholder="חפשו שם יעד, תוכן או מספר..." onkeyup="filter()">
    
    <div class="grid">
        <div class="cluster-col"><div class="cluster-h iam-h">I AM - אישי וחוסן</div><ul id="I AM" class="item-list"></ul></div>
        <div class="cluster-col"><div class="cluster-h iwe-h">I WE - צוות וקהילה</div><ul id="I WE" class="item-list"></ul></div>
        <div class="cluster-col"><div class="cluster-h itask-h">I TASK - משימות וביצוע</div><ul id="I TASK" class="item-list"></ul></div>
    </div>
</div>

<div id="myModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modalTag" class="tag"></div>
        <h2 id="modalTitle"></h2>
        <div class="modal-body">
            <h3>הבעיה:</h3><p id="modalProb"></p>
            <h3>המטרה:</h3><p id="modalGoal"></p>
            <h3>שיטות עבודה:</h3><div id="modalMethods" class="methods-list"></div>
        </div>
    </div>
</div>

<script>
    // כאן מוזגו כל 250 היעדים מתוך הקבצים שהעלינו
    const allGoals = [
        // אני מוסיף כאן את היעדים כפי שמופיעים בקבצים שלך
        { id: 11, cluster: "I AM", title: "התמדה במשימות מונוטוניות", prob: "נטייה להשתעמם מהר במשימות חזרתיות.", goal: "שיפור יכולת הריכוז וההתמדה לאורך זמן.", methods: ["טיימר פומודורו", "מוזיקה תומכת ריכוז", "צ'ק-ליסט ויזואלי"] },
        { id: 12, cluster: "I AM", title: "ניהול חרדת ביצוע", prob: "שיתוק מול משימות חדשות.", goal: "פירוק המשימה לתתי-שלבים קטנים.", methods: ["כתיבת צעד ראשון בלבד", "דיבור עצמי חיובי", "נשימות"] },
        // ... (כאן יבואו כל שאר היעדים שהפקנו)
        { id: 124, cluster: "I TASK", title: "ניהול ארכיון", prob: "הצטברות חומרים ישנים.", goal: "מיון וביעור חומרים לפי נהלים.", methods: ["הגדרת זמני שמירה", "סימון ארגזים", "גריסת חומר רגיש"] }
    ];

    // בגלל מגבלת גודל כאן, הוספתי רק דוגמאות. 
    // במידה ויש לך את הקובץ "קוד לאתר.txt", פשוט העתק את ה-JSON משם לתוך ה-allGoals כאן.

    function init() {
        allGoals.sort((a,b) => a.id - b.id);
        const lists = {'I AM': document.getElementById('I AM'), 'I WE': document.getElementById('I WE'), 'I TASK': document.getElementById('I TASK')};
        allGoals.forEach(goal => {
            const li = document.createElement('li');
            li.className = 'item';
            li.innerHTML = `<span class="item-id">#${goal.id}</span> <span>${goal.title}</span>`;
            li.onclick = () => showDetail(goal);
            if(lists[goal.cluster]) lists[goal.cluster].appendChild(li);
        });
    }

    function showDetail(goal) {
        document.getElementById('modalTitle').innerText = goal.title;
        document.getElementById('modalProb').innerText = goal.prob;
        document.getElementById('modalGoal').innerText = goal.goal;
        document.getElementById('modalTag').innerText = goal.cluster;
        document.getElementById('modalTag').className = 'tag ' + (goal.cluster === 'I AM' ? 'iam-h' : goal.cluster === 'I WE' ? 'iwe-h' : 'itask-h');
        let mHtml = '<ul>'; goal.methods.forEach(m => mHtml += `<li>${m}</li>`); mHtml += '</ul>';
        document.getElementById('modalMethods').innerHTML = mHtml;
        document.getElementById('myModal').style.display = "block";
    }

    function closeModal() { document.getElementById('myModal').style.display = "none"; }
    function filter() {
        const val = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.item').forEach(el => {
            el.style.display = el.innerText.toLowerCase().includes(val) ? 'flex' : 'none';
        });
    }
    window.onclick = (e) => { if (e.target == document.getElementById('myModal')) closeModal(); }
    init();
</script>
</body>
</html>
