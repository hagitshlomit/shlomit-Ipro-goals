<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בנק יעדי התפתחות</title>
    <style>
        :root {
            --iam: #e67e22; --imix: #27ae60; --itask: #2980b9; --inet: #8e44ad; --igrow: #16a085; --bg: #f1f5f9;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #1e293b; }
        .container { max-width: 1400px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #0f172a; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #64748b; margin-bottom: 30px; }
        .search-box { width: 100%; padding: 15px; margin-bottom: 30px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 1.1rem; outline: none; box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; }
        .cluster-col { background: #f8fafc; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; display: flex; flex-direction: column; }
        .cluster-h { padding: 15px 10px; color: white; font-weight: bold; text-align: center; font-size: 1.1rem; min-height: 60px; display: flex; align-items: center; justify-content: center; line-height: 1.2; }
        .iam-h { background: var(--iam); } .imix-h { background: var(--imix); } .itask-h { background: var(--itask); } .inet-h { background: var(--inet); } .igrow-h { background: var(--igrow); }
        .item-list { list-style: none; padding: 8px; margin: 0; max-height: 600px; overflow-y: auto; }
        .item { background: white; margin-bottom: 10px; padding: 12px; border-radius: 8px; cursor: pointer; border: 1px solid #e2e8f0; transition: 0.2s; }
        .item:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .item-title { font-weight: bold; font-size: 0.95rem; display: block; margin-bottom: 4px; }
        .item-prob { font-size: 0.85rem; color: #94a3b8; font-style: italic; line-height: 1.3; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); }
        .modal-content { background: white; margin: 5% auto; width: 90%; max-width: 700px; border-radius: 20px; overflow: hidden; position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.3); }
        .modal-header { padding: 25px; color: white; }
        .close { position: absolute; left: 20px; top: 15px; font-size: 30px; cursor: pointer; color: white; }
        .modal-body { padding: 25px; }
        .card { background: #f1f5f9; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .card-label { font-weight: bold; font-size: 0.8rem; color: #64748b; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>
<div class="container">
    <h1>בנק יעדי התפתחות</h1>
    <p class="subtitle">ניהול ידע ומצוינות מקצועית | 1-250</p>
    <input type="text" id="search" class="search-box" placeholder="חפשי לפי שם, בעיה או מספר..." onkeyup="filter()">
    <div class="grid">
        <div class="cluster-col"><div class="cluster-h iam-h">I AM<br>(1-50)</div><ul id="I AM" class="item-list"></ul></div>
        <div class="cluster-col"><div class="cluster-h imix-h">I MIX<br>(51-100)</div><ul id="I MIX" class="item-list"></ul></div>
        <div class="cluster-col"><div class="cluster-h itask-h">I TASK<br>(101-150)</div><ul id="I TASK" class="item-list"></ul></div>
        <div class="cluster-col"><div class="cluster-h inet-h">I NET<br>(151-200)</div><ul id="I NET" class="item-list"></ul></div>
        <div class="cluster-col"><div class="cluster-h igrow-h">I GROW<br>(201+)</div><ul id="I GROW" class="item-list"></ul></div>
    </div>
</div>
<div id="myModal" class="modal">
    <div class="modal-content">
        <div id="modalHeader" class="modal-header"><span class="close" onclick="closeModal()">&times;</span><h2 id="modalTitle" style="margin:0;"></h2></div>
        <div class="modal-body">
            <div class="card"><span class="card-label">הבעיה:</span><div id="modalProb"></div></div>
            <div class="card"><span class="card-label">המטרה:</span><div id="modalGoal"></div></div>
            <div class="card" style="background:#e0f2fe"><span class="card-label">שיטות עבודה:</span><ul id="modalMethods" style="margin:0; padding-right:20px;"></ul></div>
        </div>
    </div>
</div>
<script>
    let allGoals = [];
    const files = ['1-50.json', '51-100.json', '101-150.json', '151-200.json', '201-250.json'];
    async function loadData() {
        for (let f of files) {
            try {
                const r = await fetch(f + '?v=' + Date.now());
                if (r.ok) {
                    const data = await r.json();
                    data.forEach(g => { if(!allGoals.find(x => x.id === g.id)) allGoals.push(g); });
                }
            } catch (e) {}
        }
        render();
    }
    function render() {
        const containers = { 'I AM': document.getElementById('I AM'), 'I MIX': document.getElementById('I MIX'), 'I TASK': document.getElementById('I TASK'), 'I NET': document.getElementById('I NET'), 'I GROW': document.getElementById('I GROW') };
        Object.values(containers).forEach(c => c.innerHTML = '');
        allGoals.sort((a,b) => a.id - b.id).forEach(goal => {
            const li = document.createElement('li');
            li.className = 'item';
            li.innerHTML = `<span class="item-title">#${goal.id} ${goal.title}</span><div class="item-prob">${goal.prob}</div>`;
            li.onclick = () => showDetail(goal);
            const target = containers[goal.cluster.toUpperCase()];
            if(target) target.appendChild(li);
        });
    }
    function showDetail(g) {
        const colors = {'I AM': 'var(--iam)', 'I MIX': 'var(--imix)', 'I TASK': 'var(--itask)', 'I NET': 'var(--inet)', 'I GROW': 'var(--igrow)'};
        document.getElementById('modalHeader').style.backgroundColor = colors[g.cluster.toUpperCase()] || '#333';
        document.getElementById('modalTitle').innerText = g.title;
        document.getElementById('modalProb').innerText = g.prob;
        document.getElementById('modalGoal').innerText = g.goal;
        document.getElementById('modalMethods').innerHTML = g.methods.map(m => `<li>${m}</li>`).join('');
        document.getElementById('myModal').style.display = "block";
    }
    function closeModal() { document.getElementById('myModal').style.display = "none"; }
    function filter() {
        const val = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.item').forEach(el => { el.style.display = el.innerText.toLowerCase().includes(val) ? 'block' : 'none'; });
    }
    window.onclick = (e) => { if (e.target == document.getElementById('myModal')) closeModal(); }
    loadData();
</script>
</body>
</html>
