<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בנק המטרות I-PRO | עמותת שלומית</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --iam-color: #3498db; --imix-color: #e67e22; --itask-color: #2ecc71;
            --inet-color: #9b59b6; --igrow-color: #f1c40f;
        }
        body { font-family: 'Assistant', sans-serif; background-color: #f8fafc; margin: 0; padding: 20px; color: #1a202c; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; border-bottom: 3px solid #e2e8f0; padding-bottom: 20px; }
        
        .search-container { 
            position: sticky; top: 15px; z-index: 1000;
            background: white; padding: 25px; border-radius: 25px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); margin-bottom: 40px;
        }
        input { 
            width: 100%; padding: 18px; border-radius: 15px; 
            border: 2px solid #cbd5e0; font-size: 1.1em; outline: none; box-sizing: border-box;
        }
        #counter { text-align: center; margin-top: 10px; color: #718096; font-weight: bold; }

        .goal-card { 
            background: white; border-radius: 20px; padding: 30px; 
            margin-bottom: 30px; box-shadow: 0 10px 15px rgba(0,0,0,0.05);
            border-right: 15px solid #cbd5e0;
        }
        .card-IAM { border-right-color: var(--iam-color); }
        .card-IMIX { border-right-color: var(--imix-color); }
        .card-ITASK { border-right-color: var(--itask-color); }
        .card-INET { border-right-color: var(--inet-color); }
        .card-IGROW { border-right-color: var(--igrow-color); }

        .tag { display: inline-block; padding: 6px 15px; border-radius: 50px; font-size: 0.9em; font-weight: 700; color: white; margin-bottom: 15px; }
        .tag-IAM { background-color: var(--iam-color); }
        .tag-IMIX { background-color: var(--imix-color); }
        .tag-ITASK { background-color: var(--itask-color); }
        .tag-INET { background-color: var(--inet-color); }
        .tag-IGROW { background-color: var(--igrow-color); }

        .section-box { background: #f7fafc; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .label { font-weight: 700; color: #4a5568; display: block; margin-bottom: 5px; }
        .methods-list { margin: 0; padding: 0; list-style: none; }
        .methods-list li { padding: 8px 25px 8px 0; position: relative; border-bottom: 1px dashed #e2e8f0; }
        .methods-list li::before { content: "⚙️"; position: absolute; right: 0; }
        .no-results { text-align: center; padding: 50px; color: #a0aec0; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>בנק המטרות I-PRO</h1>
        <p>עמותת שלומית | 250 מטרות לפי המסמך המאוחד</p>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="חפשי מספר מטרה (למשל 195) או מילת מפתח...">
        <div id="counter">טוען נתונים...</div>
    </div>

    <div id="results"></div>
</div>

<script src="goals_data.js"></script>
<script src="goals_data_2.js"></script>

<script>
    function render(filter = '') {
        const resultsDiv = document.getElementById('results');
        const counterDiv = document.getElementById('counter');
        
        if (typeof goalsData === 'undefined') {
            resultsDiv.innerHTML = '<div class="no-results">שגיאה בטעינת הנתונים. ודאי שקבצי ה-JS קיימים.</div>';
            return;
        }

        resultsDiv.innerHTML = '';
        const searchTerm = filter.trim().toLowerCase();
        
        const filtered = goalsData.filter(g => {
            if (!isNaN(searchTerm) && searchTerm !== "") return g.id.toString() === searchTerm;
            return g.title.toLowerCase().includes(searchTerm) || 
                   g.keywords.toLowerCase().includes(searchTerm) ||
                   g.prob.toLowerCase().includes(searchTerm);
        }).sort((a, b) => a.id - b.id);

        counterDiv.innerText = `נמצאו ${filtered.length} מטרות`;

        if (filtered.length === 0) {
            resultsDiv.innerHTML = '<div class="no-results">לא נמצאו תוצאות. נסי לחפש מילה אחרת.</div>';
            return;
        }

        filtered.forEach(g => {
            resultsDiv.innerHTML += `
                <div class="goal-card card-${g.cluster}">
                    <span class="tag tag-${g.cluster}">מטרה ${g.id} | ${g.cluster}</span>
                    <h2 style="margin-top:0;">${g.title}</h2>
                    <div class="section-box"><span class="label">🔍 הבעיה:</span>${g.prob}</div>
                    <div class="section-box"><span class="label">🎯 המטרה:</span>${g.goal}</div>
                    <div class="section-box" style="background:white; border:1px solid #edf2f7;">
                        <span class="label">⚙️ דרכים אופרטיביות:</span>
                        <ul class="methods-list">${g.methods.map(m => `<li>${m}</li>`).join('')}</ul>
                    </div>
                </div>`;
        });
    }

    document.getElementById('searchInput').addEventListener('input', e => render(e.target.value));
    
    // הפעלה לאחר טעינה
    window.onload = () => { setTimeout(() => render(), 300); };
</script>
</body>
</html>
